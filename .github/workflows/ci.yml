name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - name: Pipeline tests (synthetic HydroSHEDS fixtures)
        run: python -m pytest pipeline/tests -q
      - run: npm ci
      - name: Build fixture dataset
        run: npm run data:fixture
      - run: npm test
      - run: npm run build
