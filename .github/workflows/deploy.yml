name: Deploy

# Builds the river dataset from HydroSHEDS + GeoNames and publishes the static
# site to GitHub Pages. The heavy data step only reruns when the pipeline or
# catalog changes: its output is cached by a hash of pipeline/.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rebuild_data:
        description: Ignore the cached dataset and rebuild it
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Restore built dataset
        id: dataset
        if: ${{ !inputs.rebuild_data }}
        uses: actions/cache/restore@v4
        with:
          path: public/data/rivers.json
          key: rivers-${{ hashFiles('pipeline/*.py', 'pipeline/catalog.json', 'pipeline/requirements.txt') }}

      - uses: actions/setup-python@v5
        if: steps.dataset.outputs.cache-hit != 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - if: steps.dataset.outputs.cache-hit != 'true'
        run: pip install -r pipeline/requirements.txt

      - name: Restore raw downloads
        if: steps.dataset.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: data/raw
          key: raw-hydrosheds-v10-geonames-${{ hashFiles('pipeline/fetch.py') }}

      - name: Download HydroRIVERS, HydroBASINS, GeoNames
        if: steps.dataset.outputs.cache-hit != 'true'
        run: python pipeline/fetch.py --raw-dir data/raw

      - name: Build dataset
        if: steps.dataset.outputs.cache-hit != 'true'
        run: python pipeline/build_data.py --raw-dir data/raw --out public/data/rivers.json --min-rivers 45

      - name: Save built dataset
        if: steps.dataset.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: public/data/rivers.json
          key: rivers-${{ hashFiles('pipeline/*.py', 'pipeline/catalog.json', 'pipeline/requirements.txt') }}

      - uses: actions/upload-artifact@v4
        with:
          name: rivers
          path: public/data/rivers.json

  build:
    needs: data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: rivers
          path: public/data
      - name: Test (including checks against the real dataset)
        run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
